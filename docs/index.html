<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Blood App</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blood App">
<script>
  (function () {
    var t = localStorage.getItem('healthlog_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="app-header">
    <span class="title">Blood App</span>
    <span id="conn-dot" class="conn-dot" title="Connection status"></span>
  </header>

  <main id="view"></main>

  <div id="toast" class="toast" hidden></div>

  <nav id="tabbar">
    <button class="tab-btn" data-tab="bloodPressure">
      <span class="tab-icon">🩺</span><span>BP</span>
    </button>
    <button class="tab-btn" data-tab="meditation">
      <span class="tab-icon">🧘</span><span>Meditate</span>
    </button>
    <button class="tab-btn" data-tab="exercise">
      <span class="tab-icon">🏃</span><span>Exercise</span>
    </button>
    <button class="tab-btn" data-tab="palpEvent">
      <span class="tab-icon">💓</span><span>Palp</span>
    </button>
    <button class="tab-btn" data-tab="palpCalendar">
      <span class="tab-icon">📅</span><span>Cal</span>
    </button>
    <button class="tab-btn" data-tab="heartEvent">
      <span class="tab-icon">❤️</span><span>Other Heart</span>
    </button>
    <button class="tab-btn" data-tab="trends">
      <span class="tab-icon">📈</span><span>Trends</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-icon">⚙️</span><span>Settings</span>
    </button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
